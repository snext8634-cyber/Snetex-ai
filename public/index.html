<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nova — Hinglish AI Assistant</title>
<style>
  :root{
    --txt:#eef2ff; --sub:#a5b0cf; --accent:#7c8cff; --accent2:#4fe3c1;
    --glass:rgba(20,24,45,.55); --border:rgba(255,255,255,.12);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{height:100%; margin:0}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    color:var(--txt); display:flex; justify-content:center;
    background:#060913; overflow:hidden;
  }
  .bg{position:fixed; inset:0; z-index:0; filter:blur(60px); opacity:.55;
    background: radial-gradient(40% 35% at 20% 20%, #3340a0, transparent 70%),
                radial-gradient(35% 30% at 80% 30%, #1f8a86, transparent 70%),
                radial-gradient(50% 40% at 50% 90%, #3a1a6e, transparent 70%),
                #060913;
  }
  .app{
    position:relative; z-index:1; width:100%; max-width:560px; height:100dvh;
    display:flex; flex-direction:column;
    background:var(--glass);
    backdrop-filter:blur(22px) saturate(140%); -webkit-backdrop-filter:blur(22px) saturate(140%);
    border-left:1px solid var(--border); border-right:1px solid var(--border);
  }
  @supports not (backdrop-filter:blur(1px)){ .app{background:rgba(13,17,35,.96)} }

header{
    display:flex; align-items:center; gap:10px; padding:14px 16px;
    border-bottom:1px solid var(--border);
    padding-top:calc(14px + env(safe-area-inset-top));
  }
  .avatar{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#7c8cff,#4fe3c1); font-weight:700; flex:0 0 auto}
  .who{flex:1; min-width:0}
  .who b{display:block; font-size:15px}
  .who span{font-size:11.5px; color:var(--sub)}
  .status{width:8px;height:8px;border-radius:50%;background:#4fe3c1;display:inline-block;margin-right:5px}
  .voiceToggle{
    flex:0 0 auto; display:flex; align-items:center; gap:6px;
    background:rgba(255,255,255,.08); border:1px solid var(--border); color:var(--txt);
    border-radius:20px; padding:8px 12px; font-size:13px; cursor:pointer;
  }
  .voiceToggle.on{background:rgba(79,227,193,.18); border-color:var(--accent2)}

main{flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:14px}
  .hero{text-align:center; margin:24px 0 6px}
  .orb{width:64px;height:64px;border-radius:50%;margin:0 auto 14px;
    background:radial-gradient(circle at 35% 30%,#c7d0ff,#7c8cff 45%,#2c3aa0 80%);
    box-shadow:0 0 50px rgba(124,140,255,.55)}
  .hero h1{font-size:24px; margin:0 0 6px}
  .hero p{color:var(--sub); margin:0 0 18px; font-size:14.5px}
  .chips{display:grid; grid-template-columns:1fr 1fr; gap:10px; max-width:440px; margin:0 auto}
  .chip{text-align:left; background:rgba(255,255,255,.06); border:1px solid var(--border);
    border-radius:14px; padding:12px; color:var(--txt); font-size:13.5px; cursor:pointer; line-height:1.4}
  .chip:hover{background:rgba(255,255,255,.11)}

.msg{max-width:82%; padding:11px 14px; border-radius:16px; font-size:15px; line-height:1.5; white-space:pre-wrap}
  .msg.user{margin-left:auto; background:linear-gradient(135deg,#7c8cff,#5b6bf0);
    border-bottom-right-radius:6px}
  .msg.ai{align-self:flex-start; background:rgba(255,255,255,.07); border:1px solid var(--border);
    border-bottom-left-radius:6px}
  .msg .lbl{display:block; font-size:10.5px; color:var(--sub); margin-bottom:3px}

footer{position:relative; padding:12px 14px calc(12px + env(safe-area-inset-bottom));
    border-top:1px solid var(--border); display:flex; flex-direction:column; gap:8px}
  .composer{display:flex; align-items:flex-end; gap:8px}
  .box{flex:1; display:flex; align-items:flex-end; background:rgba(255,255,255,.06);
    border:1px solid var(--border); border-radius:20px; padding:6px 8px; gap:4px}
  textarea{flex:1; background:transparent; border:none; outline:none; resize:none; color:var(--txt);
    font:inherit; font-size:15px; max-height:110px; padding:7px 4px; line-height:1.4}
  textarea::placeholder{color:#76809f}
  .ibtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--border);cursor:pointer;
    background:rgba(255,255,255,.06); color:var(--txt); font-size:18px; display:flex;align-items:center;justify-content:center; flex:0 0 auto}
  .send{background:linear-gradient(135deg,#7c8cff,#4fe3c1); border:none; color:#08102a; font-weight:700}
  .ibtn.rec{background:#ff5d7d; color:#fff; border-color:#ff5d7d; animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.6}}
  .hint{text-align:center; color:#6b7696; font-size:11px; margin:0}
  .listening{text-align:center; color:var(--accent2); font-size:12.5px; min-height:16px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="app">
    <header>
      <div class="avatar">N</div>
      <div class="who"><b>Nova</b><span><span class="status"></span>Online</span></div>
      <button class="voiceToggle" id="voiceToggle" title="Voice mode">🔊 Voice off</button>
    </header>

<main id="chat">
      <div class="hero" id="hero">
        <div class="orb"></div>
        <h1>Hi! Main Nova hoon.</h1>
        <p>Aaj main aapki kya madad kar sakta hoon?</p>
        <div class="chips">
          <button class="chip">✍️ Email ya message likhna</button>
          <button class="chip">📅 Din ki planning</button>
          <button class="chip">💡 Kuch naya seekhna</button>
          <button class="chip">💻 Coding help</button>
        </div>
      </div>
    </main>

<footer>
      <div class="listening" id="listening"></div>
      <div class="composer">
        <div class="box">
          <button class="ibtn" id="attach" title="File (local preview)">📎</button>
          <textarea id="input" rows="1" placeholder="Kuch bhi poochho..."></textarea>
          <button class="ibtn" id="mic" title="Bolkar sawal">🎤</button>
        </div>
        <button class="ibtn send" id="send" title="Bhejo">➤</button>
      </div>
      <p class="hint">Nova Hinglish me bolkar jawab deta hai • Demo</p>
    </footer>
  </div>

<script>
const chat = document.getElementById("chat");
const hero = document.getElementById("hero");
const input = document.getElementById("input");
const send = document.getElementById("send");
const mic = document.getElementById("mic");
const listening = document.getElementById("listening");
const voiceToggle = document.getElementById("voiceToggle");

let history = [];
let voiceOn = false;

// ---- Voice output (human voice) ----
function speak(text){
  if(!voiceOn || !("speechSynthesis" in window)) return;
  const clean = text.replace(/[*#`]/g,"");
  const u = new SpeechSynthesisUtterance(clean);
  const voices = speechSynthesis.getVoices();
  u.voice = voices.find(v=>v.lang.toLowerCase().startsWith("hi"))
         || voices.find(v=>v.lang.toLowerCase().startsWith("en-in"));
  u.lang = u.voice ? u.voice.lang : "hi-IN";
  u.rate = 1; u.pitch = 1;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}
if("speechSynthesis" in window) speechSynthesis.onvoiceschanged = ()=>speechSynthesis.getVoices();

voiceToggle.onclick = ()=>{
  voiceOn = !voiceOn;
  voiceToggle.textContent = voiceOn ? "🔊 Voice on" : "🔊 Voice off";
  voiceToggle.classList.toggle("on", voiceOn);
  if(!voiceOn) speechSynthesis.cancel();
  else speak("Voice mode on kar diya! Ab main bolkar jawab dungi.");
};

// ---- Messages ----
function addMsg(role, text, label){
  if(hero) { hero.remove(); hero = null; }
  const d = document.createElement("div");
  d.className = "msg " + role;
  const l = document.createElement("span"); l.className="lbl"; l.textContent = label;
  d.appendChild(l);
  d.appendChild(document.createTextNode(text));
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}

async function ask(q){
  if(!q.trim()) return;
  addMsg("user", q, "Aap");
  history.push({ role:"user", text:q });
  input.value = ""; input.style.height="auto";
  addMsg("ai", "…", "Nova");
  const loading = chat.lastElementChild;
  try{
    const r = await fetch("/api/chat", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ message:q, history })
    });
    const data = await r.json();
    const reply = data.reply || data.error || "Kuch galat ho gaya.";
    loading.lastChild.textContent = reply;
    chat.scrollTop = chat.scrollHeight;
    history.push({ role:"ai", text:reply });
    if(data.reply) speak(reply);
  }catch(e){
    loading.lastChild.textContent = "Network problem. Dobara try karo.";
  }
}

send.onclick = ()=>ask(input.value);
input.addEventListener("keydown", e=>{
  if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); ask(input.value); }
});
input.addEventListener("input", ()=>{ input.style.height="auto"; input.style.height=Math.min(input.scrollHeight,110)+"px"; });

document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{
  ask(c.textContent.replace(/^\S+\s/,""));
});

// ---- Voice input (sawal bolkar) ----
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const recog = SR ? new SR() : null;
if(recog){
  recog.lang = "hi-IN"; recog.interimResults = false; recog.continuous = false;
  recog.onresult = e=>{ const t=e.results[0][0].transcript; input.value=t; ask(t); };
  recog.onend = ()=>{ mic.classList.remove("rec"); listening.textContent=""; };
  recog.onerror = e=>{ mic.classList.remove("rec");
    listening.textContent = e.error==="not-allowed" ? "Mic permission nahi mili" : "Bol samajh nahi aaya"; };
}
mic.onclick = ()=>{
  if(!recog){ listening.textContent="Is browser me voice input supported nahi"; return; }
  try{ recog.start(); mic.classList.add("rec"); listening.textContent="🎙️ Sun raha hoon..."; }
  catch(e){ listening.textContent="Ek baar rehne do, dobara try karo"; }
};

// ---- Attachment (local preview only) ----
const attach = document.getElementById("attach");
attach.onclick = ()=>{
  const f = document.createElement("input"); f.type="file"; f.hidden=true; document.body.appendChild(f);
  f.onchange = ()=>{
    if(f.files[0]) addMsg("user", "📎 "+f.files[0].name+" (local preview)", "Aap");
    f.remove();
  };
  f.click();
};
</script>
</body>
</html>
